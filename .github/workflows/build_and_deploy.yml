name: Build and Release

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ЗАДАЧА 1: Определяем, является ли коммит релизным, и извлекаем версию.
  determine-version:
    name: Determine release version
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.check_commit.outputs.is_release }}
      tag: ${{ steps.check_commit.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Check commit message for version
        id: check_commit
        shell: bash
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"
          
          if [[ $COMMIT_MSG =~ ^(v[0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION_TAG="${BASH_REMATCH[1]}"
            echo "✅ Version found: $VERSION_TAG"
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          else
            echo " M Commit does not start with a version. Skipping release."
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "tag=" >> $GITHUB_OUTPUT
          fi

  # ЗАДАЧА 2: Сборка под Windows (x64 и x86).
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: determine-version
    if: needs.determine-version.outputs.is_release == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Build x64
      env:
        GOOS: windows
        GOARCH: amd64
      run: go build -v -o goMH.exe -ldflags="-s -w" -trimpath main.go

    - name: Build x86 (32-bit)
      env:
        GOOS: windows
        GOARCH: 386
      run: go build -v -o goMH_x86.exe -ldflags="-s -w" -trimpath main.go

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: goMH-windows
        path: |
          goMH.exe
          goMH_x86.exe

  # ЗАДАЧA 3: Публикация релиза (FTP + GitHub).
  create-release:
    name: Create and Deploy Release
    runs-on: ubuntu-latest
    needs: [build-windows, determine-version]
    if: needs.determine-version.outputs.is_release == 'true'
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download Windows build
      uses: actions/download-artifact@v4
      with:
        name: goMH-windows
        path: ./release-assets/

    # --- ГЕНЕРАЦИЯ MD5 ХЕШЕЙ ---
    - name: Generate MD5 Hashes
      working-directory: ./release-assets/
      run: |
        md5sum goMH.exe | awk '{print $1}' > goMH.md5
        md5sum goMH_x86.exe | awk '{print $1}' > goMH_x86.md5
        
        echo "=== Checksums generated ==="
        ls -la
        cat goMH.md5
        cat goMH_x86.md5

    # --- ЗАГРУЗКА НА FTP ---
    - name: Deploy to FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./release-assets/
        server-dir: ${{ secrets.FTP_TARGET_DIR }}/
        # Загружаем exe и md5
        include: '["goMH.exe", "goMH_x86.exe", "goMH.md5", "goMH_x86.md5", "config.json"]'
        state-name: .ftp-deploy-sync-state.json
        log-level: verbose

    # --- ФОРМИРОВАНИЕ RELEASE NOTES ---
    - name: Generate Release Notes from Commit
      id: generate_notes
      shell: bash
      run: |
        # --- 1. Формируем заголовок релиза ---
        RELEASE_TAG=${{ needs.determine-version.outputs.tag }}
        RELEASE_DATE=$(date +'%d.%m.%Y')
        RELEASE_TITLE="$RELEASE_TAG от $RELEASE_DATE"
        echo "Release title: $RELEASE_TITLE"
        echo "release_title=$RELEASE_TITLE" >> $GITHUB_OUTPUT

        # --- 2. Извлекаем тело коммита (все, кроме первой строки с версией) ---
        COMMIT_BODY=$(git log -1 --pretty=%B | tail -n +2)

        # --- 3. Готовим тело релиза, начиная с заголовка ---
        RELEASE_BODY="## $RELEASE_TITLE\n\n"

        # --- 4. Определяем ключевые слова и заголовки секций ---
        declare -A SECTIONS
        SECTIONS=( ["UPD"]="UPDATE" ["ADD"]="ADDED" ["FIX"]="FIXED" ["DEL"]="REMOVED" )

        # --- 5. Парсим тело коммита и формируем секции ---
        HAS_CONTENT=false
        for KEY in "${!SECTIONS[@]}"; do
          HEADER="${SECTIONS[$KEY]}"
          # Ищем строки, начинающиеся с ключа (например, "UPD:")
          ENTRIES=$(echo "$COMMIT_BODY" | grep -i "^${KEY}:" || true)

          if [[ -n "$ENTRIES" ]]; then
            HAS_CONTENT=true
            RELEASE_BODY+="### ${HEADER}:\n"
            # Преобразуем каждую найденную строку в элемент списка Markdown
            while IFS= read -r line; do
              # Удаляем ключ (например, "UPD: "), выделяем компонент жирным и добавляем дефис
              FORMATTED_LINE=$(echo "$line" | sed -E "s/^[^:]+: *([^:]+): *(.*)/- **\1**: \2/")
              RELEASE_BODY+="${FORMATTED_LINE}\n"
            done <<< "$ENTRIES"
            RELEASE_BODY+="\n"
          fi
        done

        # Если в коммите не было ничего похожего на changelog, добавляем заглушку
        if [ "$HAS_CONTENT" = false ]; then
          RELEASE_BODY+="Изменения в этой версии не описаны в сообщении коммита.\n\n"
        fi

        # --- 6. Добавляем статический футер ---
        FOOTER=$(cat <<'EOF'
        ### Важно:
        - Это приложение предназначено только для Windows-систем (10+)
        - Требуются права администратора для работы
        - Антивирусы могут ругаться из-за характера ПО (вот такая вот темпераментная утилита, хочет качать всякое)
        EOF
        )
        RELEASE_BODY+="$FOOTER"

        # --- 7. Сохраняем итоговое тело релиза в файл для передачи на следующий шаг ---
        {
          echo 'release_body<<EOF'
          echo -e "$RELEASE_BODY"
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

    # --- СОЗДАНИЕ РЕЛИЗА GITHUB ---
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.determine-version.outputs.tag }}
        name: ${{ steps.generate_notes.outputs.release_title }}
        body: ${{ steps.generate_notes.outputs.release_body }}
        draft: false
        prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
        # Прикладываем оба файла
        files: |
          ./release-assets/goMH.exe
          ./release-assets/goMH_x86.exe