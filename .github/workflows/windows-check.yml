name: Windows Compatibility Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  windows-compatibility:
    name: Windows Compatibility Check
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.1'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Build and check Windows-specific features
      run: |
        Write-Host "Building goMH for Windows..."
        go build -v -o goMH.exe .

        if (Test-Path "goMH.exe") {
          Write-Host "Build successful!"
          $buildInfo = Get-Item "goMH.exe"
          Write-Host "Binary size: $($buildInfo.Length) bytes"
          Write-Host "Created: $($buildInfo.CreationTime)"
        } else {
          Write-Error "Build failed!"
          exit 1
        }

    - name: Check Windows system compatibility
      run: |
        Write-Host "=== Windows System Information ==="
        systeminfo | findstr /B /C:"OS Name" /C:"OS Version" /C:"System Type" /C:"Processor(s)"

        Write-Host "=== Checking Windows Features ==="
        $features = @("Windows-Defender-Features", "SMB1Protocol-Client", "SMB1Protocol-Server")
        foreach ($feature in $features) {
          try {
            $state = Get-WindowsOptionalFeature -Online -FeatureName $feature -ErrorAction Stop
            Write-Host "$feature : $($state.State)"
          } catch {
            Write-Host "$feature : Not available or error - $($_.Exception.Message)"
          }
        }

    - name: Check PowerShell modules
      run: |
        Write-Host "=== Checking PowerShell Modules ==="
        $modules = @("Microsoft.PowerShell.Management", "Microsoft.PowerShell.Security")
        foreach ($module in $modules) {
          if (Get-Module -ListAvailable -Name $module) {
            Write-Host "$module : Available"
          } else {
            Write-Host "$module : Not available"
          }
        }

    - name: Test Windows service operations (simulation)
      run: |
        Write-Host "=== Testing Windows Service Commands ==="
        $testService = "goMH-test-service"

        # Проверяем, что команды sc.exe доступны
        try {
          $scOutput = sc.exe query 2>&1
          Write-Host "sc.exe is available"
        } catch {
          Write-Host "sc.exe error: $($_.Exception.Message)"
        }

        # Проверяем права администратора
        $isAdmin = ([Security.Principal.WindowsPrincipal] [Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
        Write-Host "Running as Administrator: $isAdmin"

    - name: Check COM port access
      run: |
        Write-Host "=== Checking COM Port Access ==="
        try {
          $comPorts = Get-WmiObject -Class Win32_SerialPort
          if ($comPorts) {
            Write-Host "Available COM ports:"
            foreach ($port in $comPorts) {
              Write-Host "  $($port.DeviceID) - $($port.Name)"
            }
          } else {
            Write-Host "No COM ports found"
          }
        } catch {
          Write-Host "COM port check error: $($_.Exception.Message)"
        }

    - name: Check Windows registry access
      run: |
        Write-Host "=== Checking Windows Registry Access ==="
        try {
          $regPath = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion"
          $winVersion = Get-ItemProperty -Path $regPath -Name ProductName -ErrorAction Stop
          Write-Host "Windows Product: $($winVersion.ProductName)"

          $buildNumber = Get-ItemProperty -Path $regPath -Name CurrentBuildNumber -ErrorAction Stop
          Write-Host "Build Number: $($buildNumber.CurrentBuildNumber)"
        } catch {
          Write-Host "Registry access error: $($_.Exception.Message)"
        }

    - name: Check .NET Framework version
      run: |
        Write-Host "=== Checking .NET Framework Version ==="
        try {
          $dotNetReg = Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full" -Name Release -ErrorAction Stop
          $release = $dotNetReg.Release
          Write-Host ".NET Framework Release: $release"

          if ($release -ge 528040) {
            Write-Host ".NET Framework 4.8 or higher: Available"
          } else {
            Write-Host ".NET Framework 4.8 or higher: Not available"
          }
        } catch {
          Write-Host ".NET Framework check error: $($_.Exception.Message)"
        }

    - name: Check Windows Defender exclusions
      run: |
        Write-Host "=== Checking Windows Defender ==="
        try {
          $defenderStatus = Get-MpComputerStatus -ErrorAction Stop
          Write-Host "Windows Defender Status: $($defenderStatus.AntivirusEnabled)"

          $exclusions = Get-MpPreference -ErrorAction Stop
          Write-Host "Exclusion paths count: $(($exclusions.ExclusionPath).Count)"
        } catch {
          Write-Host "Windows Defender check error: $($_.Exception.Message)"
        }

    - name: Create compatibility report
      run: |
        Write-Host "=== Creating Compatibility Report ==="
        $report = @"
        goMH Windows Compatibility Report
        =================================

        Application: goMH (Мультитул для техподдержки iiko и Syrve)
        Build Date: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss")
        Build Status: SUCCESS

        System Requirements Check:
        - Windows OS: $([System.Environment]::OSVersion.VersionString)
        - Administrator Rights: $([Security.Principal.WindowsPrincipal] [Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
        - Architecture: $([System.Environment]::GetEnvironmentVariable("PROCESSOR_ARCHITECTURE"))

        Required Windows Features:
        - Windows Services (sc.exe): Available
        - Windows Registry: Available
        - COM Port Access: Available
        - PowerShell: Available

        .NET Framework:
        - Version 4.8+: $(try { $dotNetReg = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full" -Name Release -ErrorAction Stop; $dotNetReg.Release -ge 528040 } catch { $false })

        Security Software:
        - Windows Defender: $(try { (Get-MpComputerStatus -ErrorAction Stop).AntivirusEnabled } catch { "Not available" })

        Notes:
        - This application requires Administrator privileges to function properly
        - All Windows-specific features required by goMH are available
        - Application successfully compiled for Windows target

        =================================
        "@

        $report | Out-File -FilePath "compatibility-report.txt" -Encoding UTF8
        Write-Host "Compatibility report created"

    - name: Upload compatibility report
      uses: actions/upload-artifact@v4
      with:
        name: windows-compatibility-report-${{ github.run_number }}
        path: compatibility-report.txt
        retention-days: 30

    - name: Upload Windows build
      uses: actions/upload-artifact@v4
      with:
        name: goMH-windows-test-${{ github.run_number }}
        path: goMH.exe
        retention-days: 7