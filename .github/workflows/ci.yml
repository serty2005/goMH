name: Build and Release

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ЗАДАЧА 1: Определяем, является ли коммит релизным, и извлекаем версию.
  # Эта задача - единственный источник правды для всего пайплайна.
  determine-version:
    name: Determine release version
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.check_commit.outputs.is_release }}
      tag: ${{ steps.check_commit.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Нужна полная история для лога

      - name: Check commit message for version
        id: check_commit
        shell: bash
        run: |
          # Получаем сообщение самого последнего коммита
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"

          # Ищем сообщение, которое начинается с 'v' и версии до знака тире или конца строки
          # Например: v1.2.3 или v1.2.3-some-fix
          if [[ $COMMIT_MSG =~ ^(v[0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION_TAG="${BASH_REMATCH[1]}"
            echo "✅ Version found: $VERSION_TAG"
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          else
            echo " M Commit does not start with a version. Skipping release."
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "tag=" >> $GITHUB_OUTPUT
          fi

  # ЗАДАЧА 2: Сборка под Windows. Запускается ТОЛЬКО если первая задача нашла версию.
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: determine-version
    if: needs.determine-version.outputs.is_release == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Build
      run: go build -v -o goMH.exe .

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: goMH-windows
        path: goMH.exe

  # ЗАДАЧA 3: Публикация релиза. Запускается ТОЛЬКО если первая задача нашла версию.
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-windows, determine-version]
    if: needs.determine-version.outputs.is_release == 'true'
    # Добавляем права на запись контента для создания релиза
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Windows build
      uses: actions/download-artifact@v4
      with:
        name: goMH-windows # Имя артефакта теперь без номера сборки для простоты
        path: ./release-assets/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        # Версию берем напрямую из вывода первой задачи
        tag_name: ${{ needs.determine-version.outputs.tag }}
        name: Release ${{ needs.determine-version.outputs.tag }}
        body: |
          ## goMH - Мультитул для техподдержки iiko и Syrve

          ### Скачать:
          - **Windows**: `goMH.exe` (требуются права администратора)
        draft: false
        prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
        files: ./release-assets/goMH.exe