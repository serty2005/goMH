name: Build and Release

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ЗАДАЧА 1: Определяем, является ли коммит релизным, и извлекаем версию.
  # Эта задача - единственный источник правды для всего пайплайна.
  determine-version:
    name: Determine release version
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.check_commit.outputs.is_release }}
      tag: ${{ steps.check_commit.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Нужна полная история для лога

      - name: Check commit message for version
        id: check_commit
        shell: bash
        run: |
          # Получаем сообщение самого последнего коммита
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"

          # Ищем сообщение, которое начинается с 'v' и версии до знака тире или конца строки
          # Например: v1.2.3 или v1.2.3-some-fix
          if [[ $COMMIT_MSG =~ ^(v[0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION_TAG="${BASH_REMATCH[1]}"
            echo "✅ Version found: $VERSION_TAG"
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          else
            echo " M Commit does not start with a version. Skipping release."
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "tag=" >> $GITHUB_OUTPUT
          fi

  # ЗАДАЧА 2: Сборка под Windows. Запускается ТОЛЬКО если первая задача нашла версию.
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: determine-version
    if: needs.determine-version.outputs.is_release == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Build
      run: go build -v -o goMH.exe .

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: goMH-windows
        path: goMH.exe

  # ЗАДАЧA 3: Публикация релиза. Запускается ТОЛЬКО если первая задача нашла версию.
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-windows, determine-version]
    if: needs.determine-version.outputs.is_release == 'true'
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Нужна полная история для лога

    - name: Download Windows build
      uses: actions/download-artifact@v4
      with:
        name: goMH-windows # Имя артефакта теперь без номера сборки для простоты
        path: ./release-assets/

    - name: Generate Release Notes from Commit
      id: generate_notes
      shell: bash
      run: |
        # --- 1. Формируем заголовок релиза ---
        RELEASE_TAG=${{ needs.determine-version.outputs.tag }}
        RELEASE_DATE=$(date +'%d.%m.%Y')
        RELEASE_TITLE="$RELEASE_TAG от $RELEASE_DATE"
        echo "Release title: $RELEASE_TITLE"
        echo "release_title=$RELEASE_TITLE" >> $GITHUB_OUTPUT

        # --- 2. Извлекаем тело коммита (все, кроме первой строки с версией) ---
        COMMIT_BODY=$(git log -1 --pretty=%B | tail -n +2)

        # --- 3. Готовим тело релиза, начиная с заголовка ---
        RELEASE_BODY="## $RELEASE_TITLE\n\n"

        # --- 4. Определяем ключевые слова и заголовки секций ---
        declare -A SECTIONS
        SECTIONS=( ["UPD"]="UPDATE" ["ADD"]="ADDED" ["FIX"]="FIXED" ["DEL"]="REMOVED" )

        # --- 5. Парсим тело коммита и формируем секции ---
        HAS_CONTENT=false
        for KEY in "${!SECTIONS[@]}"; do
          HEADER="${SECTIONS[$KEY]}"
          # Ищем строки, начинающиеся с ключа (например, "UPD:")
          ENTRIES=$(echo "$COMMIT_BODY" | grep -i "^${KEY}:" || true)

          if [[ -n "$ENTRIES" ]]; then
            HAS_CONTENT=true
            RELEASE_BODY+="### ${HEADER}:\n"
            # Преобразуем каждую найденную строку в элемент списка Markdown
            while IFS= read -r line; do
              # Удаляем ключ (например, "UPD: "), выделяем компонент жирным и добавляем дефис
              FORMATTED_LINE=$(echo "$line" | sed -E "s/^[^:]+: *([^:]+): *(.*)/- **\1**: \2/")
              RELEASE_BODY+="${FORMATTED_LINE}\n"
            done <<< "$ENTRIES"
            RELEASE_BODY+="\n"
          fi
        done

        # Если в коммите не было ничего похожего на changelog, добавляем заглушку
        if [ "$HAS_CONTENT" = false ]; then
          RELEASE_BODY+="Изменения в этой версии не описаны в сообщении коммита.\n\n"
        fi

        # --- 6. Добавляем статический футер ---
        FOOTER=$(cat <<'EOF'
### Важно:
- Это приложение предназначено только для Windows-систем (10+)
- Требуются права администратора для работы
- Антивирусы могут ругаться из-за характера ПО (вот такая вот темпераментная утилита, хочет качать всякое)
EOF
        )
        RELEASE_BODY+="$FOOTER"

        # --- 7. Сохраняем итоговое тело релиза в файл ---
        # Используем разделитель, чтобы не было проблем с многострочным текстом
        {
          echo 'release_body<<EOF'
          echo -e "$RELEASE_BODY"
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        # Используем данные, сгенерированные на предыдущем шаге
        tag_name: ${{ needs.determine-version.outputs.tag }}
        name: ${{ steps.generate_notes.outputs.release_title }}
        body: ${{ steps.generate_notes.outputs.release_body }}
        draft: false
        prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
        files: ./release-assets/goMH.exe